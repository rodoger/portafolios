<style>
  :root{
    --paper: #e7e5e0;
    --paper-2: #dad7cf;
    --ink: #2a2420;
    --ink-soft: #5b5349;
    --ink-faint: #8d8579;
    --rule: #c5c1b7;
    --accent: #4a3324;
    --accent-soft: #6e4f39;
    --max: 1180px;
    --edge: clamp(20px, 5vw, 64px);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- Header ---------- */
  header.site{
    position: sticky; top:0; z-index: 40;
    padding: 22px var(--edge);
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  .header-inner{
    max-width: var(--max); margin: 0 auto;
    display:flex; align-items:center; justify-content:flex-start; gap: 44px;
  }
  header.site .mark{
    font-family:'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 1.15rem; letter-spacing: 0.01em;
    display:flex; align-items:center;
  }
  header.site nav{ display:flex; align-items:center; gap: 28px; }
  header.site nav a{
    font-family:'IBM Plex Mono', monospace; font-size: 0.75rem;
    letter-spacing: 0.1em; text-transform: uppercase; text-decoration:none;
    color: var(--ink-soft); border-bottom: 1px solid transparent; padding-bottom: 3px;
  }
  header.site nav a:hover{ border-color: var(--accent); color: var(--ink); }

  .hamburger{
    display:none; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--rule); background: transparent; cursor:pointer;
    flex-direction: column; align-items:center; justify-content:center; gap: 4px;
  }
  .hamburger span{ width: 15px; height: 1px; background: var(--ink-soft); display:block; transition: transform .2s ease, opacity .2s ease; }
  .hamburger:hover{ border-color: var(--accent); }
  .hamburger.open span:nth-child(1){ transform: translateY(5px) rotate(45deg); }
  .hamburger.open span:nth-child(2){ opacity: 0; }
  .hamburger.open span:nth-child(3){ transform: translateY(-5px) rotate(-45deg); }

  @media (max-width: 720px){
    .hamburger{ display:flex; }
    header.site nav{
      position: fixed; top: 73px; left: 0; right: 0; z-index: 39;
      flex-direction: column; align-items: flex-start; gap: 0;
      background: var(--paper); border-bottom: 1px solid var(--rule);
      max-height: 0; overflow: hidden; transition: max-height .25s ease;
    }
    header.site nav.open{ max-height: 240px; }
    header.site nav a{
      width: 100%; padding: 16px var(--edge); border-bottom: 1px solid var(--rule);
    }
  }

  /* ---------- Hero ---------- */
  .hero{
    padding: clamp(50px, 10vw, 110px) var(--edge) clamp(50px, 8vw, 90px);
    width: 100%; margin: 0 auto;text-align: center;
  }
  .hero .eyebrow{ display:block; padding: 0 var(--edge); }
  .hero h1{
    font-family:'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: clamp(3.6rem, 16vw, 13rem);
    line-height: 0.92; margin: 18px 0 0; letter-spacing: -0.01em;
    white-space: nowrap; padding: 0 var(--edge); width: 100%;
  }

  /* Typographic glyph: acts as an extra character after "Portafolio", blinks */
  .glyph-wrap{
    position: relative; display: inline-block;
    height: 0.82em;
    width: calc(0.82em * 1350 / 2068);
    vertical-align: -0.06em;
    margin-left: 0.03em;
  }
  .glyph-wrap .layer{
    position: absolute; inset: 0;
    background-color: var(--ink);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }

  @keyframes blinkOpen{ 0%, 92%, 100% { opacity: 1; } 94%, 97% { opacity: 0; } }
  @keyframes blinkClosed{ 0%, 92%, 100% { opacity: 0; } 94%, 97% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce){
    .glyph-open, .glyph-closed{ animation: none; }
  }

  .hero p.lead{
    width: 100%; margin: 26px 0 0; max-width: none;
    font-size: clamp(1.05rem, 2.4vw, 1.6rem); color: var(--ink-soft); line-height: 1.5;
    padding: 0 var(--edge);
  }
  @media (max-width: 640px){
    .hero h1{ white-space: normal; }
  }

  /* ---------- Index / TOC ---------- */
  .index-section{ max-width: var(--max); margin: 0 auto; padding: 10px var(--edge) clamp(60px,8vw,110px); }
  .index-section .eyebrow{ display:block; margin-bottom: 22px; }

  .stats-section{ max-width: var(--max); margin: 0 auto; padding: 10px var(--edge) clamp(30px,5vw,50px); }
  .stats-section .eyebrow{ display:block; margin-bottom: 16px; }
  .stats-list{ display:flex; flex-wrap:wrap; gap: 10px; }
  .stat-chip{
    font-family:'IBM Plex Mono', monospace; font-size: 0.75rem; letter-spacing:.03em;
    color: var(--ink-soft); 
    padding: 7px 14px; white-space: nowrap;
  }
  .stat-chip b{ color: var(--accent); font-weight: 500; margin-left: 2px; }
  .stat-chip.stat-total{ border-color: var(--accent); color: var(--ink); }

  .index-list-wrap{ max-height: 6000px; overflow: hidden; transition: max-height .35s ease; }
  .index-list-wrap.collapsed{ max-height: 0; }

  .toc{ list-style:none; margin:0; padding:0; border-top: 1px solid var(--rule); }
  .toc li{ border-bottom: 1px solid var(--rule); }
  .toc a{
    display:flex; align-items: baseline; gap: 18px;
    text-decoration:none; padding: 18px 0; position:relative;
  }
  .toc .num{
    font-family:'IBM Plex Mono', monospace; color: var(--accent); font-size: 0.85rem; flex: 0 0 34px;
  }
  .toc .title{
    font-family:'Fraunces', serif; font-weight: 500; font-size: clamp(0.95rem, 1.8vw, 1.3rem);
    flex: 1 1 auto; transition: transform .15s ease;
  }
  .toc a:hover .title{ transform: translateX(6px); }
  .toc .meta{
    font-family:'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: .05em; white-space:nowrap;
  }
  .toc a{ padding: 14px 0; }

  /* ---------- Filter bar ---------- */
  .filter-bar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .filter-bar input[type=text]{
    flex: 1 1 220px; font-family:'IBM Plex Sans', sans-serif; font-size:0.9rem;
    padding: 9px 12px; border: 1px solid var(--rule); background: transparent; color: var(--ink);
    border-radius:3px;
  }
  .filter-bar input:focus{ outline:none; border-color: var(--accent); color: var(--ink); }

  .ms-filter{ position: relative; }
  .ms-toggle{
    font-family:'IBM Plex Mono', monospace; font-size:0.74rem; text-transform:uppercase;
    padding: 9px 10px; border:1px solid var(--rule); background: var(--paper); color: var(--ink-soft);
    border-radius:3px; letter-spacing:.03em; cursor:pointer; white-space:nowrap;
  }
  .ms-toggle:hover{ border-color: var(--accent); }
  .ms-toggle.active{ border-color: var(--accent); color: var(--accent); }
  .ms-panel{
    position:absolute; top: calc(100% + 6px); left:0; z-index: 25; min-width: 210px; max-height: 260px;
    overflow-y:auto; background: var(--paper); border:1px solid var(--rule); border-radius:3px;
    padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.14);
  }
  .ms-panel[hidden]{ display:none; }
  .ms-option{
    display:flex; align-items:center; gap:9px; padding: 7px 6px;
    font-family:'IBM Plex Sans', sans-serif; font-size:0.85rem; color: var(--ink);
    cursor:pointer; border-radius:2px;
  }
  .ms-option:hover{ background: var(--paper-2); }
  .ms-option input{ accent-color: var(--accent); width:14px; height:14px; flex-shrink:0; }

  .filter-bar .clear-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem; text-transform:uppercase;
    background:transparent; border:1px solid var(--rule); color: var(--ink-faint);
    padding:9px 14px; border-radius:3px; cursor:pointer;
  }
  .filter-bar .clear-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .no-results{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color: var(--ink-faint); padding: 24px 0; }

  /* ---------- Project ---------- */
  .project{
    max-width: var(--max); margin: 0 auto;
    padding: clamp(50px,8vw,90px) var(--edge);
    border-top: 1px solid var(--rule);
  }
  .project-head{
    display:flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    margin-bottom: 26px; flex-wrap: wrap;
  }
  .plate{ font-family:'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--ink-faint); letter-spacing:.08em; }
  .plate b{ color: var(--accent); }
  .project h2{
    font-family:'Fraunces', serif; font-weight: 500; font-style: normal;
    font-size: clamp(1.6rem, 4vw, 2.9rem); line-height: 1.05; margin: 6px 0 0;
  }
  .project .figure{
    position: relative;
    width: 100%; aspect-ratio: 16/10; overflow:hidden; background: var(--paper-2);
    border: 1px solid var(--rule); margin: 30px 0;
  }
  .project .figure img{ width:100%; height:100%; object-fit: cover; display:block; }
  .project .figure.vertical{
    aspect-ratio: 3/4; max-width: 480px; margin-left: auto; margin-right: auto;
  }
  .figure-freeze{ position:absolute; inset:0; width:100%; height:100%; display:none; }
  .figure-controls{
    position:absolute; top:12px; right:12px; z-index:2;
    display:flex; gap:8px;
  }
  .fig-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.55);
    background: rgba(20,18,16,.5); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter: blur(2px);
  }
  .fig-btn:hover{ background: rgba(20,18,16,.8); }
  .fig-btn svg{ width:16px; height:16px; }

  /* ---------- Lightbox ---------- */
  .lightbox-overlay{
    position: fixed; inset: 0; background: rgba(18,16,14,.94); z-index: 300;
    display:none; align-items:center; justify-content:center; padding: 5vh 5vw;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-media{ position:relative; display:flex; }
  .lightbox-overlay img{
    max-width: 92vw; max-height: 88vh; object-fit: contain;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .lightbox-media canvas{ position:absolute; inset:0; width:100%; height:100%; display:none; }
  .lightbox-close{
    position: fixed; top: 22px; right: 26px; width:42px; height:42px; border-radius:50%;
    border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.4); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index: 301;
  }
  .lightbox-close:hover{ background: rgba(0,0,0,.7); }
  .lightbox-controls{
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 301;
    display:flex; gap:10px;
  }
  .figure .fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .project-body{
    display:grid; grid-template-columns: 1fr 1.6fr; gap: 50px;
  }
  .project-meta{ display:flex; flex-direction:column; gap: 16px; }
  .project-meta div span.label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.68rem;
    text-transform:uppercase; letter-spacing:.1em; color: var(--ink-faint); margin-bottom: 4px;
  }
  .project-meta div span.value{ font-size: 0.95rem; color: var(--ink); }
  .project-desc{ font-size: clamp(1rem, 1.6vw, 1.2rem); line-height: 1.7; color: var(--ink-soft); max-width: 62ch; }
  .project-desc a.ext-link{
    display:inline-block; margin-top: 18px; font-family:'IBM Plex Mono', monospace;
    font-size: 0.78rem; text-transform:uppercase; letter-spacing:.08em;
    text-decoration:none; border-bottom: 1px solid var(--accent); color: var(--accent); padding-bottom: 2px;
  }
  .desc-actions{ display:flex; align-items:center; gap: 24px; flex-wrap:wrap; }
  .pdf-btn{
    display:inline-flex; align-items:center; margin-top: 18px;
    font-family:'IBM Plex Mono', monospace; font-size: 0.78rem;
    text-transform:uppercase; letter-spacing:.08em; text-decoration:none;
    color: var(--paper); background: var(--accent);
    padding: 10px 18px; border-radius: 3px;
  }
  .pdf-btn:hover{ background: var(--ink); }

  @media (max-width: 720px){
    .project-body{ grid-template-columns: 1fr; gap: 24px; }
  }

  /* ---------- Footer ---------- */
  footer.site{
    max-width: var(--max); margin: 0 auto; padding: clamp(50px,8vw,90px) var(--edge) 70px;
    border-top: 1px solid var(--rule);
  }
  footer.site h3{
    font-family:'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 20px;
  }
  footer.site .contact-line{ font-size: 1rem; color: var(--ink-soft); }
  footer.site .foot-meta{
    margin-top: 40px; font-family:'IBM Plex Mono', monospace; font-size: 0.72rem;
    color: var(--ink-faint); display:flex; justify-content: space-between; flex-wrap:wrap; gap:10px;
  }

  /* ---------- Empty state ---------- */
  .empty-state{
    max-width: 640px; margin: 0 auto; padding: 90px var(--edge); text-align:center;
  }
  .empty-state p{ color: var(--ink-soft); line-height:1.6; }

  .loading-msg{ text-align:center; padding: 100px 20px; font-family:'IBM Plex Mono', monospace; color: var(--ink-faint); letter-spacing: .05em; }

  /* ---------- Print ---------- */
  @media print{
    *, *::before, *::after{
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    header.site{ display:none !important; }
    .no-print{ display:none !important; }
    .figure-controls, .lightbox-overlay{ display:none !important; }
    body{ background: #fff; }
    .glyph-open, .glyph-closed{ animation: none; opacity: 1; }
    .glyph-closed{ display: none; }
    .hero, .stats-section, .index-section, .project, footer.site{ max-width: 100%; }
    .project{ break-inside: avoid; page-break-before: always; border-top:none; padding-top: 20px; }
    .project:first-of-type{ page-break-before: auto; }
    .index-section{ page-break-after: always; }
    .index-list-wrap, .index-list-wrap.collapsed{ max-height: none !important; overflow: visible !important; }
    .figure{ break-inside: avoid; }
    a.ext-link::after{ content: " (" attr(href) ")"; font-size: 0.7em; }

    /* Smaller type, bigger imagery on the printed page */
    .hero h1{ font-size: 30pt !important; white-space: normal; }
    .hero p.lead{ font-size: 9.5pt !important; }
    .toc .title{ font-size: 10pt !important; }
    .toc .num, .toc .meta{ font-size: 6.5pt !important; }
    .project h2{ font-size: 15pt !important; }
    .plate, .project .eyebrow{ font-size: 6.5pt !important; }
    .project-meta div span.value{ font-size: 8pt !important; }
    .project-meta div span.label{ font-size: 5.5pt !important; }
    .project-desc{ font-size: 9pt !important; line-height: 1.45 !important; }
	   /* ---------- cambio tamaño de impresión de imagenes---------- */
    .project .figure{ aspect-ratio: 4/3 !important; max-height: 12cm !important; width: auto !important; max-width: 100% !important; margin: 10px auto !important; }
    .project .figure.vertical{ aspect-ratio: 3/4 !important; max-height: 16cm !important; max-width: 80% !important; margin: 10px auto !important; }
    @page{ margin: 1.6cm; }
    @page{
      @bottom-center{ content: counter(page); font-family: monospace; font-size: 9pt; color: #55534c; }
    }
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <div class="mark" id="brandName">Portafolios &nbsp;<span class="glyph-wrap" role="img" aria-label="marca gráfica"><span class="layer glyph-open"></span><span class="layer glyph-closed"></span></span></div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav id="siteNav">
      <a href="#indice">Índice</a>
      <a href="#contacto">El Autor</a>
      <a href="#" id="printLink">Imprimir</a>
    </nav>
  </div>
</header>

<main id="mainContent">
  <div class="loading-msg" id="loadingMsg">Cargando portafolios…</div>
</main>

<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">✕</button>
  <div class="lightbox-media" id="lightboxMedia">
    <img id="lightboxImg" src="" alt="">
  </div>
  <div class="lightbox-controls" id="lightboxControls" style="display:none;">
    <button type="button" class="fig-btn" id="lightboxPlayPause" data-paused="0" title="Pausar"></button>
  </div>
</div>

<script>
(function(){
  const mainEl = document.getElementById('mainContent');

  // -----------------------------------------------------------------
  // Pega aquí el enlace CSV de tu hoja de Google Sheets publicada:
  // Archivo -> Compartir -> Publicar en la Web -> elige la hoja -> formato CSV
  // Ejemplo: 'https://docs.google.com/spreadsheets/d/e/XXXXX/pub?output=csv'
  // Mientras esté vacío, se muestran proyectos de ejemplo.
  //
  // Columnas que puede tener cada fila: Orden, Titulo, Categoria, Anio,
  // Cliente, Descripcion, Imagen, Enlace, PDF, Orientacion.
  // La columna PDF es opcional: si tiene una URL, aparece el botón
  // "Descargar PDF" en ese proyecto; si está vacía, el botón no se muestra.
  // La columna Orientacion es opcional: escribe "vertical" para que la
  // imagen de ese proyecto se muestre en formato vertical; cualquier otro
  // valor (o vacío) la deja en horizontal.
  // -----------------------------------------------------------------
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3S282oj90LbGAyGO83wKr1YoZYa21lUuqWN8SJVAYepc7vVt2KMRqYFJLhTDEUg/pub?output=csv';

  document.getElementById('printLink').addEventListener('click', (e)=>{ e.preventDefault(); window.print(); closeNav(); });

  // Hamburger / mobile nav
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const siteNav = document.getElementById('siteNav');
  hamburgerBtn.addEventListener('click', ()=>{
    const isOpen = siteNav.classList.toggle('open');
    hamburgerBtn.classList.toggle('open', isOpen);
    hamburgerBtn.setAttribute('aria-expanded', String(isOpen));
  });
  siteNav.addEventListener('click', (e)=>{ if(e.target.tagName === 'A') closeNav(); });
  function closeNav(){
    siteNav.classList.remove('open');
    hamburgerBtn.classList.remove('open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
  }

  // ---------- Sample data (shown until SHEET_CSV_URL is set) ----------
  const SAMPLE_DATA = [
    { orden:'1', titulo:'Sistema editorial Marfil', categoria:'Identidad + Editorial', anio:'2025', cliente:'Estudio Marfil', descripcion:'Rediseño de identidad y sistema tipográfico para una casa editorial independiente, incluyendo retícula, papelería y colección de portadas.', imagen:'', enlace:'' },
    { orden:'2', titulo:'Naviera del Sur', categoria:'Branding', anio:'2024', cliente:'Naviera del Sur', descripcion:'Identidad visual completa para operador logístico marítimo: marca, señalética de puerto y manual de aplicación.', imagen:'', enlace:'' },
    { orden:'3', titulo:'Museo de Artes Populares', categoria:'Wayfinding', anio:'2023', cliente:'MAP', descripcion:'Sistema de señalización e impresos para exposición temporal, con tipografía a gran escala inspirada en textiles tradicionales.', imagen:'', enlace:'' },
  ];

  function driveDirect(url){
    if(!url) return '';
    const m1 = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
    const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    const id = (m1 && m1[1]) || (m2 && m2[1]);
    if(id) return `https://drive.google.com/uc?export=view&id=${id}`;
    return url;
  }

  function norm(str){
    return (str||'').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .trim();
  }

  function pick(row, keys){
    for(const k of Object.keys(row)){
      if(keys.includes(norm(k))) return (row[k]||'').toString().trim();
    }
    return '';
  }

  function mapRows(rawRows){
    return rawRows
      .filter(r => Object.values(r).some(v => (v||'').toString().trim() !== ''))
      .map((r, i) => ({
        orden: pick(r,['orden','order','no','num']) || String(i+1),
        titulo: pick(r,['titulo','título','title','proyecto']),
        categoria: pick(r,['categoria','categoría','category']),
        anio: pick(r,['anio','año','year']),
        cliente: pick(r,['cliente','client']),
        descripcion: pick(r,['descripcion','descripción','description']),
        imagen: pick(r,['imagen','imagen url','image','imagenurl','foto']),
        enlace: pick(r,['enlace','link','url']),
        pdf: pick(r,['pdf','pdf url','pdfurl','descargar pdf','documento pdf']),
        orientacion: pick(r,['orientacion','orientación','orientation','disposicion','disposición'])
      }))
      .sort((a,b)=> (parseFloat(a.orden)||9999) - (parseFloat(b.orden)||9999));
  }

  const ICON_EXPAND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`;
  const ICON_PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
  const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8V4z"/></svg>`;

  function isGif(url){ return /\.gif(\?|#|$)/i.test(url || ''); }

  function figureHTML(imgUrl, titulo, orientacion){
    const src = driveDirect(imgUrl);
    const isVertical = norm(orientacion).startsWith('vert');
    const cls = isVertical ? 'figure vertical' : 'figure';
    if(!src){
      return `<div class="${cls}"><div class="fallback">Sin imagen</div></div>`;
    }
    const gifBtn = isGif(src)
      ? `<button type="button" class="fig-btn fig-play-pause" data-paused="0" title="Pausar">${ICON_PAUSE}</button>`
      : '';
    const canvasEl = isGif(src) ? `<canvas class="figure-freeze"></canvas>` : '';
    return `<div class="${cls}">
      <img class="figure-img" src="${src}" alt="${titulo}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;fallback&quot;>Imagen no disponible</div>'">
      ${canvasEl}
      <div class="figure-controls">
        ${gifBtn}
        <button type="button" class="fig-btn fig-expand" title="Ver a pantalla completa">${ICON_EXPAND}</button>
      </div>
    </div>`;
  }

  const GLYPH_HTML = `<span class="glyph-wrap" role="img" aria-label="marca gráfica"><span class="layer glyph-open"></span><span class="layer glyph-closed"></span></span>`;

  function renderProjects(data){
    if(!data.length){
      mainEl.innerHTML = `
        <div class="empty-state">
          <p class="eyebrow">Sin proyectos</p>
          <p>Aún no hay filas con contenido en tu hoja. Agrega al menos una fila con título y descripción, y actualiza esta página.</p>
        </div>`;
      return;
    }

    const toc = data.map((p,i)=>{
      const search = norm([p.titulo,p.descripcion,p.cliente,p.categoria].join(' '));
      return `
      <li data-idx="${i}" data-anio="${p.anio}" data-cliente="${p.cliente}" data-categoria="${p.categoria}" data-search="${search}">
        <a href="#p-${i+1}">
          <span class="num">${String(i+1).padStart(2,'0')}</span>
          <span class="title">${p.titulo || 'Sin título'}</span>
          <span class="meta">${[p.categoria,p.anio].filter(Boolean).join(' · ')}</span>
        </a>
      </li>`;}).join('');

    const projects = data.map((p,i)=>{
      const search = norm([p.titulo,p.descripcion,p.cliente,p.categoria].join(' '));
      return `
      <section class="project" id="p-${i+1}" data-idx="${i}" data-anio="${p.anio}" data-cliente="${p.cliente}" data-categoria="${p.categoria}" data-search="${search}">
        <div class="project-head">
          <div class="plate">Obra N.º <b>${String(i+1).padStart(2,'0')}</b> / ${String(data.length).padStart(2,'0')}</div>
          <div class="eyebrow">${p.categoria || ''}</div>
        </div>
        <h2>${p.titulo || 'Sin título'}</h2>
        ${figureHTML(p.imagen, p.titulo, p.orientacion)}
        <div class="project-body">
          <div class="project-meta">
            ${p.cliente ? `<div><span class="label">Cliente</span><span class="value">${p.cliente}</span></div>` : ''}
            ${p.anio ? `<div><span class="label">Año</span><span class="value">${p.anio}</span></div>` : ''}
            ${p.categoria ? `<div><span class="label">Categoría</span><span class="value">${p.categoria}</span></div>` : ''}
          </div>
          <div class="project-desc">
            <p>${p.descripcion || ''}</p>
            <div class="desc-actions">
              ${p.enlace ? `<a class="ext-link" href="${p.enlace}" target="_blank" rel="noopener">Ver obra en Internet →</a>` : ''}
              ${p.pdf ? `<a class="pdf-btn no-print" href="${p.pdf}" target="_blank" rel="noopener">Descargar PDF ↓</a>` : ''}
            </div>
          </div>
        </div>
      </section>`;}).join('');

    const categoryCounts = {};
    data.forEach(p => {
      const cat = p.categoria || 'Sin categoría';
      categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
    });
    const statsHTML = Object.entries(categoryCounts)
      .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0], 'es'))
      .map(([cat,count])=> `<span class="stat-chip">${cat} <b>${count}</b></span>`)
      .join('');

    mainEl.innerHTML = `
      <section class="hero">
        <span class="eyebrow">Obras seleccionadas</span>
        <h1>Portafolios &nbsp;${GLYPH_HTML}</h1>
        <p class="lead">Reseñas de proyectos de diseño gráfico, diseño multimedia y comunicación visual de <b>Rodolfo&nbsp;Gerardo&nbsp;Ortiz&nbsp;Morales</b></p>
      </section>

      <section class="stats-section">
        <span class="eyebrow">Obras por categoría</span>
        <div class="stats-list">
          <span class="stat-chip stat-total">Total <b>${data.length}</b></span>
          ${statsHTML}
        </div>
      </section>

      <section class="index-section" id="indice">
        <span class="eyebrow">Índice</span>
        <div class="filter-bar no-print">
          <input type="text" id="searchInput" placeholder="Buscar por título, cliente, categoría…">
          <div class="ms-filter" id="msAnio">
            <button type="button" class="ms-toggle" data-label="Año" aria-expanded="false">Año</button>
            <div class="ms-panel" hidden></div>
          </div>
          <div class="ms-filter" id="msCliente">
            <button type="button" class="ms-toggle" data-label="Cliente" aria-expanded="false">Cliente</button>
            <div class="ms-panel" hidden></div>
          </div>
          <div class="ms-filter" id="msCategoria">
            <button type="button" class="ms-toggle" data-label="Categoría" aria-expanded="false">Categoría</button>
            <div class="ms-panel" hidden></div>
          </div>
          <button type="button" class="clear-btn" id="toggleIndexBtn" aria-expanded="false">Todas las obras</button>
          <button type="button" class="clear-btn" id="clearFilters">Limpiar</button>
        </div>
        <div class="index-list-wrap collapsed" id="indexListWrap">
          <ul class="toc">${toc}</ul>
          <p class="no-results" id="noResults" style="display:none;">No se encontraron proyectos con esos filtros.</p>
        </div>
      </section>

      ${projects}

      <footer class="site" id="contacto">
        <h3>El autor</h3>
        <p class="contact-line"><img src="rodo_cdmx.jpg" loading="lazy" style="float: left; margin-right: 20px; margin-bottom: 10px; alt="Rodolfo G. Ortiz Morales" width="200" >•	Profesional académico en diseño y producción multimedia
	•	Profesional en proyectos sociales

    setupFilters(data);

  function setupFilters(data){
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearFilters');
    const noResults = document.getElementById('noResults');
    const toggleBtn = document.getElementById('toggleIndexBtn');
    const listWrap = document.getElementById('indexListWrap');
    if(!searchInput) return;

    function openList(){
      listWrap.classList.remove('collapsed');
      toggleBtn.setAttribute('aria-expanded', 'true');
      toggleBtn.textContent = 'Ocultar índice';
    }
    function closeList(){
      listWrap.classList.add('collapsed');
      toggleBtn.setAttribute('aria-expanded', 'false');
      toggleBtn.textContent = 'Todas las obras';
    }
    toggleBtn.addEventListener('click', ()=>{
      if(listWrap.classList.contains('collapsed')) openList(); else closeList();
    });

    function uniqueSorted(field){
      return [...new Set(data.map(p => p[field]).filter(Boolean))].sort((a,b)=> a.localeCompare(b, 'es'));
    }

    // ---- Custom multi-select (checkbox dropdown) filters ----
    const allPanels = [];
    function closeAllPanels(){
      allPanels.forEach(p => { p.panel.hidden = true; p.toggle.setAttribute('aria-expanded','false'); });
    }
    document.addEventListener('click', (e)=>{
      if(!e.target.closest('.ms-filter')) closeAllPanels();
    });

    function createMultiSelect(containerId, field, values){
      const container = document.getElementById(containerId);
      const toggle = container.querySelector('.ms-toggle');
      const panel = container.querySelector('.ms-panel');
      const label = toggle.dataset.label;
      const selected = new Set();

      values.forEach(v => {
        const opt = document.createElement('label');
        opt.className = 'ms-option';
        opt.innerHTML = `<input type="checkbox" value="${v}"><span>${v}</span>`;
        panel.appendChild(opt);
      });

      function updateLabel(){
        toggle.textContent = selected.size ? `${label} (${selected.size})` : label;
        toggle.classList.toggle('active', selected.size > 0);
      }

      panel.addEventListener('change', (e)=>{
        if(e.target.type !== 'checkbox') return;
        if(e.target.checked) selected.add(e.target.value); else selected.delete(e.target.value);
        updateLabel();
        applyFilters();
      });

      toggle.addEventListener('click', (e)=>{
        e.stopPropagation();
        const willOpen = panel.hidden;
        closeAllPanels();
        panel.hidden = !willOpen;
        toggle.setAttribute('aria-expanded', String(willOpen));
      });

      allPanels.push({ toggle, panel });

      return {
        selected,
        clear(){
          selected.clear();
          panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
          updateLabel();
        }
      };
    }

    const msAnio = createMultiSelect('msAnio', 'anio', uniqueSorted('anio'));
    const msCliente = createMultiSelect('msCliente', 'cliente', uniqueSorted('cliente'));
    const msCategoria = createMultiSelect('msCategoria', 'categoria', uniqueSorted('categoria'));

    function applyFilters(){
      const q = norm(searchInput.value);
      let visibleCount = 0;

      document.querySelectorAll('.toc li[data-idx]').forEach(li => {
        const match = (!q || li.dataset.search.includes(q))
          && (msAnio.selected.size === 0 || msAnio.selected.has(li.dataset.anio))
          && (msCliente.selected.size === 0 || msCliente.selected.has(li.dataset.cliente))
          && (msCategoria.selected.size === 0 || msCategoria.selected.has(li.dataset.categoria));
        li.style.display = match ? '' : 'none';
        const section = document.getElementById(`p-${Number(li.dataset.idx)+1}`);
        if(section) section.style.display = match ? '' : 'none';
        if(match) visibleCount++;
      });

      noResults.style.display = visibleCount === 0 ? 'block' : 'none';

      const hasActiveFilter = q || msAnio.selected.size || msCliente.selected.size || msCategoria.selected.size;
      if(hasActiveFilter) openList();
    }

    searchInput.addEventListener('input', applyFilters);
    clearBtn.addEventListener('click', ()=>{
      searchInput.value = '';
      msAnio.clear(); msCliente.clear(); msCategoria.clear();
      applyFilters();
      closeList();
    });
  }

  function loadFromUrl(url){
    mainEl.innerHTML = `<div class="loading-msg">Cargando portafolio…</div>`;
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results)=>{
        try{
          const data = mapRows(results.data);
          renderProjects(data);
        }catch(e){
          mainEl.innerHTML = `<div class="empty-state"><p class="eyebrow">Error al procesar</p><p>No se pudo interpretar el CSV. Verifica que SHEET_CSV_URL apunte a una hoja publicada en formato CSV.</p></div>`;
        }
      },
      error: ()=>{
        mainEl.innerHTML = `<div class="empty-state"><p class="eyebrow">No se pudo cargar</p><p>Revisa que la hoja esté publicada en la Web (no solo compartida) y que el enlace en SHEET_CSV_URL termine en formato CSV.</p></div>`;
      }
    });
  }

  // ---------- Fullscreen lightbox + GIF pause/play ----------
  const lightboxOverlay = document.getElementById('lightboxOverlay');
  const lightboxMedia = document.getElementById('lightboxMedia');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxControls = document.getElementById('lightboxControls');
  const lightboxPlayPause = document.getElementById('lightboxPlayPause');
  let lightboxCanvas = null;

  function freezeFrame(img, canvas, mode){
    const rect = img.getBoundingClientRect();
    if(!rect.width || !rect.height) return false;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const nw = img.naturalWidth || rect.width;
    const nh = img.naturalHeight || rect.height;
    let dw, dh, dx, dy;
    if(mode === 'cover'){
      const scale = Math.max(rect.width / nw, rect.height / nh);
      dw = nw * scale; dh = nh * scale;
      dx = (rect.width - dw) / 2; dy = (rect.height - dh) / 2;
    }else{
      dw = rect.width; dh = rect.height; dx = 0; dy = 0;
    }
    try{
      ctx.drawImage(img, dx, dy, dw, dh);
      return true;
    }catch(err){
      return false; // e.g. tainted canvas from a cross-origin image without CORS headers
    }
  }

  function togglePlayPause(btn, img, canvas, mode){
    const isPaused = btn.dataset.paused === '1';
    if(!isPaused){
      if(freezeFrame(img, canvas, mode)){
        canvas.style.display = 'block';
        img.style.visibility = 'hidden';
        btn.dataset.paused = '1';
        btn.innerHTML = ICON_PLAY;
        btn.title = 'Reproducir';
      }
    }else{
      canvas.style.display = 'none';
      img.style.visibility = 'visible';
      btn.dataset.paused = '0';
      btn.innerHTML = ICON_PAUSE;
      btn.title = 'Pausar';
    }
  }

  function openLightbox(sourceImg){
    lightboxImg.src = sourceImg.currentSrc || sourceImg.src;
    lightboxImg.alt = sourceImg.alt || '';
    lightboxOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    if(isGif(sourceImg.src)){
      lightboxControls.style.display = 'flex';
      lightboxPlayPause.dataset.paused = '0';
      lightboxPlayPause.innerHTML = ICON_PAUSE;
      if(!lightboxCanvas){
        lightboxCanvas = document.createElement('canvas');
        lightboxMedia.appendChild(lightboxCanvas);
      }
      lightboxCanvas.style.display = 'none';
      lightboxImg.style.visibility = 'visible';
    }else{
      lightboxControls.style.display = 'none';
    }
  }

  function closeLightbox(){
    lightboxOverlay.classList.remove('open');
    document.body.style.overflow = '';
    if(lightboxCanvas) lightboxCanvas.style.display = 'none';
    lightboxImg.style.visibility = 'visible';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxOverlay.addEventListener('click', (e)=>{ if(e.target === lightboxOverlay) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });
  lightboxPlayPause.addEventListener('click', ()=>{
    if(!lightboxCanvas) return;
    togglePlayPause(lightboxPlayPause, lightboxImg, lightboxCanvas, 'contain');
  });

  document.addEventListener('click', (e)=>{
    const expandBtn = e.target.closest('.fig-expand');
    if(expandBtn){
      const img = expandBtn.closest('.figure')?.querySelector('img.figure-img');
      if(img) openLightbox(img);
      return;
    }
    const ppBtn = e.target.closest('.fig-play-pause');
    if(ppBtn){
      const fig = ppBtn.closest('.figure');
      const img = fig.querySelector('img.figure-img');
      const canvas = fig.querySelector('canvas.figure-freeze');
      if(img && canvas) togglePlayPause(ppBtn, img, canvas, 'cover');
    }
  });

  if(SHEET_CSV_URL){
    loadFromUrl(SHEET_CSV_URL);
  }else{
    renderProjects(SAMPLE_DATA);
  }
})();
</script>
